name: Build DashCast IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project CWR15.xcodeproj \
            -target DashCast \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SYMROOT="$PWD/build" \
            build > build.log 2>&1 || true
          echo "=== tail ==="
          tail -5 build.log
          echo "=== errors ==="
          grep -E "error:" build.log | sed 's|.*/CWR15/||' | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log || exit 1

      - name: 打包 IPA
        run: |
          set -e
          ls -la build/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Release-iphoneos/DashCast.app Payload/
          zip -qry DashCast-unsigned.ipa Payload
          ls -lh DashCast-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DashCast-unsigned-ipa
          path: DashCast-unsigned.ipa
          if-no-files-found: error

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
