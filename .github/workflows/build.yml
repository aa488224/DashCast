name: Build DashCast IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 编译（未签名）
        run: |
          set -e
          xcodebuild \
            -project CWR15.xcodeproj \
            -target DashCast \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" \
            build

      - name: 打包 IPA
        run: |
          set -e
          ls -la build/Release-iphoneos/
          mkdir -p Payload
          cp -R build/Release-iphoneos/DashCast.app Payload/
          zip -qry DashCast-unsigned.ipa Payload
          ls -lh DashCast-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DashCast-unsigned-ipa
          path: DashCast-unsigned.ipa
          if-no-files-found: error
